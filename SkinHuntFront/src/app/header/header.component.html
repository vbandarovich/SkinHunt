<nav class="navbar navbar-expand-lg p-0">
  <div class="header">
    <a class="navbar-brand ms-1" [routerLink]="['']">
      <img
        src="assets/new_logo.png"
        height="44"
        width="122"
        alt="SkinHunt"
        loading="lazy"
      />
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="buttonsNav.toggle()"
      aria-expanded="false"
      aria-label="Toggle navigation"
    >
      <i class="fas fa-bars"></i>
    </button>

    <div
      class="collapse navbar-collapse"
      id="navbarButtonsExample"
      mdbCollapse
      #buttonsNav="mdbCollapse"
    >
      <ul class="navbar-nav me-auto mb-2 ms-4 mb-lg-0">
        <li>
          <a class="nav-link" [routerLink]="['']">
            Market
            <span class="absolute-strip-market"></span>
          </a>
        </li>
      </ul>

      <div class="language-dropdown-button me-4">
        <div mdbDropdown #flagDropdown class="dropdown">
          <button
            class="btn dropdown-toggle p-0"
            type="button"
            id="flagDropdownMenuButton"
            aria-expanded="false"
            mdbDropdownToggle
          >
            @if (language$() === 'ru') {
              <i class="flag flag-russia"></i>
            }
            @if (language$() === 'eng') {
              <i class="flag flag-united-states"></i>
            }
          </button>
          <ul
            mdbDropdownMenu
            class="dropdown-menu dropdown-menu-end dropdown-menu-start"
            aria-labelledby="flagDropdownMenuButton"
          >
            <li>
              <a class="dropdown-item" (click)="setLanguage('ru')">
                <i class="flag flag-russia"></i>
                Русский
              </a>
            </li>
            <li>
              <a class="dropdown-item" (click)="setLanguage('eng')">
                <i class="flag flag-united-states"></i>
                English
              </a>
            </li>
          </ul>
        </div>
      </div>
      <div class="currency-dropdown-button me-4">
        <div mdbDropdown #currencyDropdown class="dropdown">
          <button
            class="btn dropdown-toggle p-0"
            type="button"
            id="currencyDropdownMenuButton"
            aria-expanded="false"
            mdbDropdownToggle
          >
            @if (currency$() === 'usd') {
              $ USD
            }
            @if (currency$() === 'byn') {
              Br BYN
            }
          </button>
          <ul
            mdbDropdownMenu
            class="dropdown-menu dropdown-menu-end dropdown-menu-start"
            aria-labelledby="currencyDropdownMenuButton"
          >
            <li><a class="dropdown-item" (click)="setCurrency('usd')">$ USD</a></li>
            <li><a class="dropdown-item" (click)="setCurrency('byn')">Br BYN</a></li>
          </ul>
        </div>
      </div>
      <div class="d-flex align-items-center">
        @if (this.authService.user$()) {
          <div class="text-white fs-6 me-2">
            Баланс: {{userBalance$()}} $
          </div>
          <div mdbDropdown #profileDropdown class="dropdown">
            <button
              class="btn dropdown-toggle p-0 d-flex align-items-center"
              type="button"
              id="profileDropdownMenuButton"
              aria-expanded="false"
              mdbDropdownToggle
            >
              <a class="nav-link d-sm-flex align-items-sm-center">
                <img
                  [src]="userAvatar$()"
                  class="rounded-circle"
                  height="30"
                  width="30"
                  alt=""
                  loading="lazy"
                />
              </a>
            </button>
            <ul mdbDropdownMenu
                class="dropdown-menu dropdown-menu-end dropdown-menu-start"
                aria-labelledby="rofileDropdownMenuButton">
              <li>
                <a class="dropdown-item" [routerLink]="['/profile']">Профиль</a>
              </li>
              @if (this.adminMenu$()) 
              {
                <li>
                  <a class="dropdown-item" [routerLink]="['/users']">Пользователи</a>
                </li>
              }
              <li>
                <a class="dropdown-item" (click)="logOutHandler()">
                  Выйти
                  <i class="fas fa-sign-out-alt ms-1"></i>
                </a>
              </li>
            </ul>
          </div>
        }
        @else{
          <button type="button" class="button-styles me-2" (click)="openSignInModal()">
            <span class="email-styles">
              <img src="assets/email-icon.png" alt="email">
            </span>
            Войти через Email
          </button>
        }
      </div>
    </div>
  </div>
</nav>
